<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AllStar Remote">
  <title>AllStar Remote</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">ALLSTARLINK 3</div>
        <h1>Node Remote</h1>
      </div>
      <button id="settingsBtn" class="round" type="button" aria-label="Settings">⚙︎</button>
    </header>

    <section class="card local-card">
      <div>
        <div class="label">LOCAL NODE</div>
        <div id="localNodeDisplay" class="local-node">Not set</div>
      </div>
      <div class="bridge"><span></span>iPhone bridge</div>
    </section>

    <section class="controls">
      <label class="label" for="remoteNode">REMOTE NODE</label>
      <div class="node-wrap">
        <input id="remoteNode" inputmode="numeric" pattern="[0-9]*"
               autocomplete="off" autocorrect="off" spellcheck="false"
               placeholder="Enter node number">
        <button id="clearBtn" class="clear" type="button" aria-label="Clear">×</button>
      </div>

      <div class="actions">
        <button id="linkBtn" class="action link" type="button">
          <b>LINK</b><small>Transceive</small>
        </button>
        <button id="unlinkBtn" class="action unlink" type="button">
          <b>UNLINK</b><small>Selected node</small>
        </button>
      </div>

      <button id="monitorBtn" class="secondary" type="button">Monitor Only</button>
    </section>

    <section class="card recent-card">
      <div class="section-head">
        <div>
          <div class="label">RECENT NODES</div>
          <div class="hint">Tap a node to load it.</div>
        </div>
        <button id="clearRecentBtn" class="text-btn" type="button">Clear</button>
      </div>
      <div id="recentNodes" class="recent-list"><span class="empty">None yet</span></div>
    </section>

    <button id="disconnectAllBtn" class="danger" type="button">Disconnect All Links</button>
    <div id="message" class="message" role="status" aria-live="polite"></div>

    <footer>
      <div>AllStar Remote <strong>v0.1.0</strong></div>
      <div>GitHub Pages → iPhone Shortcut → ASL3</div>
    </footer>
  </main>

  <div id="sheetBackdrop" class="backdrop hidden">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="handle"></div>
      <div class="section-head">
        <h2 id="settingsTitle">Settings</h2>
        <button id="closeSettingsBtn" class="round" type="button" aria-label="Close">×</button>
      </div>

      <label class="field-label" for="localNodeInput">Your local AllStar node number</label>
      <input id="localNodeInput" class="field" inputmode="numeric" pattern="[0-9]*"
             autocomplete="off" placeholder="e.g. 630011">

      <label class="field-label" for="shortcutInput">iPhone Shortcut name</label>
      <input id="shortcutInput" class="field" autocomplete="off" value="AllStar Bridge">

      <div class="info">
        SSH username/password are not stored here or on GitHub. They stay only in Apple Shortcuts on your iPhone.
      </div>

      <button id="saveSettingsBtn" class="save" type="button">Save Settings</button>
    </section>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
